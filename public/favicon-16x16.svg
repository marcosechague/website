<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Ultra simple gradient background -->
  <defs>
    <linearGradient id="simpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simple rounded square -->
  <rect x="1" y="1" width="14" height="14" rx="3" ry="3" fill="url(#simpleGrad)"/>
  
  <!-- Large opening bracket - taking almost full height -->
  <text x="4" y="8" font-family="monospace" font-size="10" font-weight="bold" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">{</text>
  
  <!-- Centered "M" - much larger -->
  <text x="8" y="8" font-family="Arial,sans-serif" font-size="8" font-weight="900" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">M</text>
  
  <!-- Large closing bracket - taking almost full height -->
  <text x="12" y="8" font-family="monospace" font-size="10" font-weight="bold" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">}</text>
</svg>