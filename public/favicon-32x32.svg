<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple gradient background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clean rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="url(#bgGrad)"/>
  
  <!-- Large opening bracket - taking most of the space -->
  <text x="7" y="16" font-family="monospace" font-size="20" font-weight="bold" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">{</text>
  
  <!-- Centered "M" letter - much larger -->
  <text x="16" y="16" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">M</text>
  
  <!-- Large closing bracket - taking most of the space -->
  <text x="25" y="16" font-family="monospace" font-size="20" font-weight="bold" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">}</text>
</svg>