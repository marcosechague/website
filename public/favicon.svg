<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clean rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#bgGradient)"/>
  
  <!-- Large opening bracket - taking almost full height -->
  <text x="14" y="32" font-family="monospace" font-size="42" font-weight="bold" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">{</text>
  
  <!-- Centered "M" letter - much larger -->
  <text x="32" y="32" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">M</text>
  
  <!-- Large closing bracket - taking almost full height -->
  <text x="50" y="32" font-family="monospace" font-size="42" font-weight="bold" fill="#0a0f0c" text-anchor="middle" dominant-baseline="middle">}</text>
</svg>